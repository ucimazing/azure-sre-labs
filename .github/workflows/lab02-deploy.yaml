# Release pipeline for Lab 02: rolls an app version out to the servers with ZERO downtime.
#   After lab02-image publishes a new image on main -> deploy THAT image (after your approval).
#   "Run workflow" button with a tag              -> deploy any earlier image: a manual rollback.
# Build once, deploy the same image everywhere: this pipeline never builds anything.
# Logs in to Azure with OIDC, as environment lab02 (subject ...:environment:lab02).
name: lab02-deploy

on:
  workflow_run:
    workflows: [lab02-image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (a full git commit SHA that lab02-image built)"
        required: true

permissions:
  id-token: write
  contents: read

# One release at a time, never cancelled halfway (that could leave a server out of the pool).
concurrency:
  group: lab02-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Rolling deploy (needs approval)
    # Only after a SUCCESSFUL image build (a failed build has nothing to deploy).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: lab02
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out one server at a time
        run: bash lab02-ha/scripts/rolling-deploy.sh "$TAG"

      - name: Prove it from the outside
        run: |
          IP=$(az network public-ip list -g rg-lab02-ha --query "[?ipConfiguration && contains(ipConfiguration.id, 'applicationGateways')].ipAddress | [0]" -o tsv)
          for _ in 1 2 3 4 5 6; do curl -fsS "http://$IP/healthz"; echo; done
          echo "Live: http://$IP/healthz" >> "$GITHUB_STEP_SUMMARY"
