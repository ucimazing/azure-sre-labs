# Installs Docker on the VM and runs the Lab 1 compose stack there.
# The image is built on the VM (amd64), not on the Mac (arm64).
- name: Deploy lab01 to the VM
  hosts: app
  become: true
  gather_facts: false
  vars:
    app_root: /opt/lab01
    release_tgz: "{{ playbook_dir }}/../build/release.tgz"
    # Generated once on your Mac and kept in ansible/secrets/ (gitignored).
    postgres_password: "{{ lookup('ansible.builtin.password', playbook_dir + '/secrets/postgres_password', chars=['ascii_letters', 'digits'], length=24) }}"

  pre_tasks:
    - name: Wait for SSH on the new VM
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Wait for cloud-init to finish (it holds the apt lock on first boot)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        update_cache: true

    - name: Add Docker apt repo (and its signing key)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true

    - name: Start Docker on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let azureuser run docker without sudo
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: true

    - name: Remove previous release
      ansible.builtin.file:
        path: "{{ app_root }}/src"
        state: absent

    - name: Create release dir
      ansible.builtin.file:
        path: "{{ app_root }}/src"
        state: directory
        mode: "0755"

    - name: Unpack release (git archive of the committed code)
      ansible.builtin.unarchive:
        src: "{{ release_tgz }}"
        dest: "{{ app_root }}/src"

    - name: Write .env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_root }}/src/lab01-web-app/.env"
        mode: "0600"

    - name: Build and start the stack
      ansible.builtin.command: docker compose up -d --build --wait --remove-orphans
      args:
        chdir: "{{ app_root }}/src/lab01-web-app"
      changed_when: true

  post_tasks:
    - name: Check readiness from the VM itself
      ansible.builtin.uri:
        url: http://127.0.0.1/readyz
      register: ready
      retries: 10
      delay: 3
      until: ready.status == 200
