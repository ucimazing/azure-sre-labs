# Lab 01 reverse proxy: the only container reachable from outside.
# Flow: client -> nginx :80 (published as :8088) -> app :8000 (private)

# The app servers Nginx can forward to. "app" is the compose SERVICE name,
# resolved by Docker's DNS. In Lab 2 you'll list 3 servers here for load balancing.
upstream app_backend {
    server app:8000;
    keepalive 16;                  # reuse connections to the app instead of opening one per request
}

server {
    listen 80 default_server;      # default_server: also answers requests with any other Host header
    server_name umeshdas.dev www.umeshdas.dev localhost;

    client_max_body_size 1m;       # reject request bodies over 1 MB before they reach the app
    server_tokens off;             # don't advertise the Nginx version in headers and error pages

    # Nginx's own health endpoint: answers even when the app is down.
    location = /nginx-health {
        access_log off;            # don't fill the logs with health-check noise
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://app_backend;

        # Needed for upstream keepalive (HTTP/1.1, and clear the "Connection: close" header).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tell the app who really called. Without these, every request looks like it came from Nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast instead of hanging if the app is down or stuck.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }
}
