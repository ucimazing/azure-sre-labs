# Ansible collections this playbook needs, PINNED so every machine gets a compatible version.
# Why: Ubuntu 24.04's apt package ships community.docker 3.7.0, whose docker_compose_v2 has no `wait`
# option (your Mac's newer Ansible does), so the same playbook worked locally but failed on the VM.
# 4.x has `wait` and still supports the VM's ansible-core 2.16.
#
# Install:  ansible-galaxy collection install -r requirements.yml
collections:
  - name: community.docker
    version: ">=4.0.0,<5.0.0"
