- name: Set up lab01VM
  hosts: app
  become: true

  tasks:
    - name: Install packages Ansible needs for the Docker repo
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian]
        update_cache: true
    - name: Add Docker's official apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg
    - name: Install Docker engine and compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
    - name: Start Docker now and on every boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Let azureuser use docker without sudo
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: true

